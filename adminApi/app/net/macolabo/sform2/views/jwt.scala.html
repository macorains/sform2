@(redirect_url:String, jwt:String)
@*
  管理画面(SPA)とAPIはオリジンが異なるため、ここで localStorage に保存してもSPAからは読めない。
  トークンはURLフラグメントで渡し、SPA側(main.js)で保存してURLから除去する。
  フラグメントはサーバーへ送信されないのでアクセスログには残らない。
  location.replace を使い、このページ自体を履歴に残さない。
*@
<script>
    window.location.replace('@(redirect_url)' + '#sform_token=' + encodeURIComponent('@(jwt)'))
</script>
